<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JUSFEM — Mobile</title>
<script src="/support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  body { margin:0; background:#EFEDF1; -webkit-font-smoothing:antialiased; }
  * { box-sizing:border-box; }
  a { color:#622C7B; text-decoration:none; }
  a:hover { color:#4A1F5E; }
</style>
</helmet>

<div style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:40px 24px">
  <x-import component-from-global-scope="IOSDevice" from="/mobile/ios-frame.jsx" width="{{ frameW }}" height="{{ frameH }}" hint-size="375px,812px">
    <div style="{{ screenStyle }}">
      <iframe src="/UI" title="JusfemIA en mobile" style="{{ iframeStyle }}"></iframe>
    </div>
  </x-import>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:520,&quot;height&quot;:900}}">
class Component extends DCLogic {
  renderVals() {
    return {
      frameW: 375,
      frameH: 812,
      screenStyle: "height:100%; padding:62px 0 34px; background:#F7F6F8",
      iframeStyle: "width:100%; height:100%; border:none; display:block; background:#F7F6F8"
    };
  }
}

</script>
</body>
</html>
