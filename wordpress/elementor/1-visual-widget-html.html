<!--
  JUSFEM IA — VISUAL (animaciones compiladas)
  Va en un widget HTML de Elementor, columna DERECHA de la sección.

  Las animaciones son las mismas del prototipo, pero compiladas con esbuild:
  sin Babel ni el runtime de Claude Design. ~215 KB en total (75 del bundle
  + 142 de React) contra los 3,5 MB del iframe original.

  MONTAJE: donde dice PEGAR-BUNDLE-AQUI va el contenido completo de
  jusfem-anims.min.js (este archivo lo deja aparte para que se pueda leer).
-->

<!--
  NOTA IMPORTANTE SOBRE EL ESCALADO
  El SVG que genera el stage trae width/height en px pero NO trae viewBox,
  y sin viewBox un SVG no escala su contenido: solo lo recorta. Por eso,
  si el contenedor es mas chico que 1152x1080, cada animacion muestra una
  porcion distinta (una se ve bien y otra aparece en blanco).
  Solucion: montar a tamano nativo y escalar el contenedor con transform.
-->

<div class="jia-visual" data-jia-visual>
  <div class="jia-visual__glows" aria-hidden="true">
    <span class="jia-visual__glow jia-visual__glow--a"></span>
    <span class="jia-visual__glow jia-visual__glow--b"></span>
    <span class="jia-visual__glow jia-visual__glow--c"></span>
  </div>
  <div class="jia-visual__marco"><div class="jia-visual__anim" id="jia-anim"></div></div>
</div>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script>
/* PEGAR-BUNDLE-AQUI → contenido de jusfem-anims.min.js */
</script>
<script>
(function(){
  var PIEZAS=["argumento","documento","favoritos"], DUR=[40000,15000,15000];
  var NW=1152, NH=1080;   // tamaño nativo del stage

  function init(){
    var vis=document.querySelector("[data-jia-visual]");
    var cont=document.getElementById("jia-anim");
    var marco=vis&&vis.querySelector(".jia-visual__marco");
    if(!vis||!cont||!marco||vis.dataset.listo) return;
    if(!window.React||!window.ReactDOM||!window.JusfemAnim) return setTimeout(init,200);
    vis.dataset.listo="1";

    // El stage no se adapta solo al contenedor: se monta a tamaño nativo
    // y se escala al ancho real del marco (y se recalcula si cambia).
    cont.style.width=NW+"px"; cont.style.height=NH+"px";
    cont.style.transformOrigin="0 0"; cont.style.position="absolute";
    cont.style.left="0"; cont.style.top="0";
    function escalar(){ cont.style.transform="scale("+(marco.clientWidth/NW)+")"; }
    escalar();
    if(window.ResizeObserver) new ResizeObserver(escalar).observe(marco);
    else window.addEventListener("resize",escalar);

    var raiz=ReactDOM.createRoot(cont), i=0, timer=null, visible=false;

    // Puente con el acordeón de Elementor (clásico o anidado).
    function tabs(){
      var r=vis.closest(".e-con.e-parent, .elementor-section")||document;
      var sel=[".elementor-accordion .elementor-tab-title",
               ".e-n-accordion-item > .e-n-accordion-item-title"];
      for(var k=0;k<sel.length;k++){
        var f=[].slice.call(r.querySelectorAll(sel[k]));
        if(f.length>=2) return f;
      }
      return [];
    }
    var T=tabs();

    function mostrar(n,desdeClic){
      i=n; cont.style.opacity="0";
      raiz.render(React.createElement(window.JusfemAnim,
        {key:PIEZAS[n], pieza:PIEZAS[n], scenes:window.JusfemEscenas[PIEZAS[n]]}));
      setTimeout(function(){ escalar(); cont.style.opacity="1"; },60);
      if(!desdeClic&&T[n]&&!T[n].classList.contains("elementor-active")){
        var d=T[n].closest("details"); if(!d||!d.open) T[n].click();
      }
      clearTimeout(timer);
      if(visible) timer=setTimeout(function(){ mostrar((i+1)%PIEZAS.length,false); },DUR[i]||15000);
    }

    T.forEach(function(t,k){ t.addEventListener("click",function(){ mostrar(k,true); }); });

    // Solo anima mientras la sección está en pantalla.
    if("IntersectionObserver" in window){
      new IntersectionObserver(function(e){ e.forEach(function(en){
        visible=en.isIntersecting;
        if(visible) mostrar(i,false); else clearTimeout(timer);
      }); },{threshold:0.25}).observe(vis);
    } else { visible=true; mostrar(0,false); }
  }

  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",init);
  else init();
})();
</script>
